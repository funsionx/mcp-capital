# portfolio-mcp — MCP HTTP server + background cron scheduler.
# Shared SQLite volume: both services use DB_PATH=/data/portfolio.db
#
# Traefik: app joins external network `proxy-net` (same as your Traefik container).
# Set TRAEFIK_HOST (+ OAUTH_ISSUER=https://<host>) in .env before `docker compose up`.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#
# Local debug without Traefik: use docker-compose.local.yml
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Optional: bind-mount manual positions (create file first):
#   - ./positions.local.json:/app/positions.local.json:ro

services:
  app:
    build:
      context: .
      args:
        BUN_IMAGE: oven/bun:1-alpine
    init: true
    container_name: portfolio-mcp
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /data/portfolio.db
    volumes:
      - pfdata:/data
    networks:
      - default
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.portfolio-mcp.rule=Host(`truth-teller.online`)"
      - "traefik.http.routers.portfolio-mcp.entrypoints=websecure"
      - "traefik.http.routers.portfolio-mcp.tls.certresolver=myresolver"
      - "traefik.http.services.portfolio-mcp.loadbalancer.server.port=3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cron:
    build:
      context: .
      args:
        BUN_IMAGE: oven/bun:1-alpine
    init: true
    stop_grace_period: 120s
    container_name: portfolio-mcp-cron
    command: ["bun", "run", "src/cron/index.ts"]
    env_file: .env
    environment:
      DB_PATH: /data/portfolio.db
    volumes:
      - pfdata:/data
    networks:
      - default
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pfdata:
    name: portfolio-mcp-data

networks:
  proxy-net:
    external: true
